<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>AltSchool Application Form</title>
</head>
<body>
   
   <img src="../assets/academic.webp" alt="academic image">
   
   <h1>Learn highly sought after skills without hassle.</h1>
   
   <p>Already an AltSchooler? <a href="#">Sign in!</a></p>

   <form action="">
      <h2>Signup</h2>
      <p>Take the next steps to apply at AltSchool Africa</p>
      <fieldset>
         <!-- <legend>Personal Information</legend> -->
         <label for="fname">First Name</label><br>
         <input type="text" id="fname" placeholder="Enter first name"><br>
      
         <label for="lname">Last name</label><br>
         <input type="text" id="lname" placeholder="Enter last name"><br>
      
         <label for="gender">Gender</label><br>
         <select name="gender" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
         </select><br>
      
         <label for="dob">Date of Birth</label><br>
         <input type="date" id="dob"><br>
      </fieldset>

      <fieldset>
         <!-- <legend>Contacts</legend> -->
         <label for="email">Email Address</label><br>
         <input type="email" id="email" placeholder="Enter email address"><br>
      
         <label for="phone-number">Phone Number</label><br>
         <input type="tel" id="phone-number" placeholder="08154387000"><br>
      </fieldset>
   </form>

</body>
</html>

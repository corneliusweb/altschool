<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>AltSchool Application Form</title>

   <style>
      fieldset {
         border: none;
      }
   </style>
</head>
<body>
   
   <img src="./assets/academic.webp" alt="academic image">
   
   <h1>Learn highly sought after skills without hassle.</h1>
   
   <p>Already an AltSchooler? <a href="#">Sign in!</a></p>

   <form action="">
      <h2>Signup</h2>
      <p>Take the next steps to apply at AltSchool Africa</p>
      <fieldset>
         <!-- <legend>Personal Information</legend> -->
         <label for="fname">First Name</label><br>
         <input type="text" id="fname" placeholder="Enter first name"><br>
      
         <label for="lname">Last name</label><br>
         <input type="text" id="lname" placeholder="Enter last name"><br>
      
         <label for="gender">Gender</label><br>
         <select name="gender" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
         </select><br>
      
         <label for="dob">Date of Birth</label><br>
         <input type="date" id="dob"><br>
      </fieldset>

      <fieldset>
         <!-- <legend>Contacts</legend> -->
         <label for="email">Email Address</label><br>
         <input type="email" id="email" placeholder="Enter email address"><br>
      
         <label for="phone-number">Phone Number</label><br>
         <input type="tel" id="phone-number" placeholder="08154387000"><br>
      </fieldset>

      <fieldset>
         <!-- <legend>Residential Address</legend> -->
         <label for="country">Country</label><br>
         <select name="country" id="country">
            <option value="Select your country" disabled selected>Select your country</option>
            <option value="Nigeria">Nigeria</option>
            <option value="Ghana">Ghana</option>
            <option value="Senegal">Senegal</option>
         </select><br>
      
         <label for="residence">State/City of Residence</label><br>
         <input type="text" id="residence" placeholder="Enter your state of providence"><br>
      </fieldset>

      <fieldset>
         <!-- <legend>Publicity Channel</legend> -->
         <label for="publicity">How did you hear about us?</label><br>
         <select name="publicity channel" id="publicity">
            <option value="Select channel" disabled selected>Select channel</option>
            <option value="Twitter">Twitter</option>
            <option value="Facebook">Facebook</option>
            <option value="Linkedin">Linkedin</option>
            <option value="Billboard">Billboard</option>
         </select><br>
      </fieldset>

      <fieldset>
         <!-- <legend>Password</legend> -->
         <label for="password">Password</label><br>
         <input type="password" id="password" placeholder="Enter password"><br>
         
         <label for="confirm-password">Confirm password</label><br>
         <input type="password" id="confirm-password" placeholder="Enter password again"><br>
      </fieldset>
      
      <button type="submit">Submit</button>
   </form>
   <p>
      By clicking continue, I agree to <a href="#">Terms of Use</a> and acknowledge that I
      have read the <a href="#">Privacy Policy</a>.
   </p>

</body>
</html>

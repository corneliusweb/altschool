<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Insta Spots</title>
   <link rel="stylesheet" href="style.css">
   <script src="https://kit.fontawesome.com/0f7c3f0d77.js" crossorigin="anonymous"></script>
</head>
<body>
   <header>
      <div class="logo">
         <img src="./assets/images/Logo.svg" alt="Insta Spot logo">
      </div>
      <div class="profile">
         <div class="profile-info">
            <div class="pic">
               <img src="./assets/images/profile.png" alt="profile pic">
            </div>
            <div class="text">
               <div class="profile-heading">
                  <h1>Bessie Coleman</h1>
                  <p>Civil Avatar</p>
               </div>
               <button> <i class="fa-solid fa-pen"></i> Edit Profile</button>
            </div>
         </div>
         <button><i class="fa-solid fa-plus"></i> New Post</button>
      </div>
   </header>
   <main>
      <div class="card">
         <img src="./assets/images/val-thorens.png" alt="val Thorens">
         <div>
            <h2>Val Thorens</h2>
            <i class="fa-regular fa-heart"></i>
         </div>
      </div>
      <div class="card">
         <img src="./assets/images/terrace.png" alt="restaurant terrace">
         <div>
            <h2>Restaurant Terrace</h2>
            <i class="fa-regular fa-heart"></i>
         </div>
      </div>
      <div class="card">
         <img src="./assets/images/restaurant.png" alt="public restaurant">
         <div>
            <h2>An outdoor cafe</h2>
            <i class="fa-regular fa-heart"></i>
         </div>
      </div>
      <div class="card">
         <img src="./assets/images/bridge.png" alt="long bridge">
         <div>
            <h2>A very long bridge, over the forest...</h2>
            <i class="fa-regular fa-heart"></i>
         </div>
      </div>
      <div class="card">
         <img src="./assets/images/tunnel.png" alt="sunlit tunnel">
         <div>
            <h2>Tunnel with morning light</h2>
            <i class="fa-regular fa-heart"></i>
         </div>
      </div>
      <div class="card">
         <img src="./assets/images/mountain-house.png" alt="a house on a mountain">
         <div>
            <h2>Mountain house</h2>
            <i class="fa-regular fa-heart"></i>
         </div>
      </div>
   </main>
</body>
</html>
